name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA (the tag in the comment is for humans): a moved or hijacked tag
# cannot change what runs here.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Install ONLY from the hash-pinned lock: a tampered or unexpected wheel fails the build.
      - name: Install from lockfile
        run: |
          python -m pip install --no-cache-dir uv==0.5.9
          uv pip sync --system --require-hashes requirements-dev.lock
      - name: Tests
        run: python -m pytest -q
      - name: Doctor (fails on any FAIL check)
        run: python -m scripts.promptwise doctor

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      # Lockfile only, no install scripts (same supply-chain posture as the Python lock).
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
