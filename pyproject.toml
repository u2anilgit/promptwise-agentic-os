[project]
name = "promptwise-core"
version = "0.1.0"
description = "PromptWise Agentic OS — core engine"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.48",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "typer>=0.27",
    "mcp>=2.3,<3",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.25",
    "qdrant-client>=1.19,<2",
    "packaging>=24",
    "sqlalchemy>=2.0.49,<2.1",
    "alembic>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "httpx>=0.28", "pytest-asyncio>=0.23", "semgrep>=1.79"]

[project.scripts]
promptwise = "scripts.promptwise:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "gateway*", "scripts*"]

[tool.setuptools.package-data]
core = ["config/*.yaml"]
"core.routing" = ["*.yaml"]
"core.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "gateway/tests", "scripts/tests"]
asyncio_mode = "auto"
