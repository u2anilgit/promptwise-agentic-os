[project]
name = "promptwise-core"
version = "0.1.0"
description = "PromptWise Agentic OS — core engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "mcp>=1.2",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.25",
    "qdrant-client>=1.19,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-asyncio>=0.23", "semgrep>=1.45"]

[project.scripts]
promptwise = "scripts.promptwise:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "gateway*", "scripts*"]

[tool.setuptools.package-data]
core = ["config/*.yaml"]
"core.routing" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "gateway/tests", "scripts/tests"]
asyncio_mode = "auto"
