engine:
  name: promptwise-agentic-os
  local_only: true
routing:
  default_tier: local-small
policy:
  default_effect: deny
diagnostics:
  log_retention_days: 14
  hardware_profile_path: config/hardware_profile.yaml
gateway:
  port: 8000
paths:
  packs_installed: packs/installed
  model_catalog: catalog/model_catalog.yaml
verify:
  test_command: ""
  lint_command: ""
  lint_blocks: false
  semgrep_config: "auto"
  max_identical_failures: 3
  failure_ledger_path: .promptwise/failure_ledger.json
  max_output_chars: 4000
