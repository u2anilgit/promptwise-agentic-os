engine:
  name: promptwise-agentic-os
  local_only: true
routing:
  default_tier: local-small
policy:
  default_effect: deny
  tool_registry_path: tool_registry.yaml
diagnostics:
  log_retention_days: 14
  hardware_profile_path: config/hardware_profile.yaml
gateway:
  port: 8000
  allowed_roots: []
  allowed_verify_commands: []
paths:
  packs_installed: packs/installed
  packs_registry: packs/registry
  model_catalog: catalog/model_catalog.yaml
  policies_dir: policies
database:
  url: ""
  path: .promptwise/agentic.sqlite3
spec:
  allow_ungrounded: false
  trivial_max_requirements: 1
  check_timeout_seconds: 300
  allow_fileless_checks: false
  enforce_command_policy: true
  require_mutation: false
  require_reviewer: false
security:
  known_bad_packages_path: security/known_bad_packages.yaml
  lockfile_path: requirements.lock
  require_tool_pins: false
audit:
  log_path: .promptwise/agentic_audit.jsonl
memory:
  db_path: .promptwise/memory.sqlite3
  qdrant_url: http://127.0.0.1:6333
  ollama_base_url: http://127.0.0.1:11434
  embedding_model: nomic-embed-text
  embedding_dim: 768
  extraction_tier_hint: local-small
verify:
  test_command: ""
  lint_command: ""
  lint_blocks: false
  semgrep_config: "auto"
  max_identical_failures: 3
  failure_ledger_path: .promptwise/failure_ledger.json
  max_output_chars: 4000
  mutation_command: ""
  mutation_timeout_seconds: 1800
  reviewer_command: ""
  reviewer_timeout_seconds: 300
