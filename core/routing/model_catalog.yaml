# core/routing/model_catalog.yaml — packaged fallback copy of catalog/model_catalog.yaml
# (Aug-2026 model refresh, docs/research/aug2026-findings.md). Used only when the
# configured/resolved catalog path doesn't exist on disk (e.g. pip install outside
# a repo checkout). catalog/model_catalog.yaml at the repo root is the canonical,
# editable copy — edit that one, keep this one in sync.
# Tier order is derived at runtime by core/routing/catalog.py's tier_order(), not
# hardcoded here.
tiers:
  local-small:
    provider: ollama
    model_id: "llama3.2:3b"
    min_ram_gb: 4.0
    requires_cloud: false
    cost_per_1k_input_usd: 0.0
    cost_per_1k_output_usd: 0.0

  local-large:
    provider: ollama
    model_id: "qwen2.5:14b"
    min_ram_gb: 12.0
    requires_cloud: false
    cost_per_1k_input_usd: 0.0
    cost_per_1k_output_usd: 0.0

  cloud-cheap:
    provider: anthropic
    model_id: "claude-haiku-4-5"
    min_ram_gb: 0.0
    requires_cloud: true
    cost_per_1k_input_usd: 0.001
    cost_per_1k_output_usd: 0.005

  cloud-premium:
    provider: anthropic
    model_id: "claude-sonnet-5"
    min_ram_gb: 0.0
    requires_cloud: true
    cost_per_1k_input_usd: 0.003
    cost_per_1k_output_usd: 0.015
