# policies/default.yaml — docs/ARCHITECTURE.md §2. Empty by default: every
# action is denied unless a rule here (or a project-level policies file)
# explicitly allows it. This is intentional — see policy.default_effect
# in core/config/defaults.yaml.
rules: []

# The spec engine (core/spec) policy-gates every acceptance-check command as
# `shell:run:<program>` before running it. NOTE: allowing an interpreter (python, node,
# sh...) allows arbitrary code run through it; prefer allowing a specific test runner,
# and a path-qualified program (bin/python) is matched by its resolved absolute path.
# To let it run, e.g., python and pytest:
#
# rules:
#   - action: "shell:run:python"
#     effect: allow
#   - action: "shell:run:pytest"
#     effect: allow
